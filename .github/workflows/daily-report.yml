name: 香葱预测

on:
  schedule:
    # GitHub Actions 使用 UTC。北京时间每日 03:00 前后 = UTC 前一日 19:00 前后。
    # GitHub 官方说明：定时任务在高负载时可能延迟，甚至整点直接跳过；
    # 且整点 :00 排队最久。故设两个时间点互为冗余，任一跑成功即可；
    # 重复运行只是覆盖当天报告（文件名按日期，幂等），不会产生重复归档。
    - cron: '5 19 * * *'       # 北京 03:05（避开整点拥堵）
    - cron: '35 19 * * *'      # 北京 03:35（冗余补跑）
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xiangcong-daily-report
  cancel-in-progress: false

env:
  # GitHub Actions 默认 UTC。指定时区可让报告日期/文件名为北京时间。
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 同步远端最新产出（防止覆盖历史报告）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git merge --ff-only "origin/${GITHUB_REF_NAME}" 2>/dev/null; then
            git merge --no-edit -X theirs "origin/${GITHUB_REF_NAME}" \
              || echo "::warning::合并远端产出失败，按本地版本继续"
          fi

      - name: 生成日报
        run: python run.py

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs data
          if git diff --staged --quiet; then
            echo "无内容变更，跳过提交"
          else
            # 不加 -u：env.TZ 已是 Asia/Shanghai，取北京时间日期
            # （cron 19:00 UTC 对应北京次日 03:00，用 -u 会让提交标题整整早一天）
            git commit -m "chore: 香葱预测 $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true      # Pages 未启用时不阻断报告生成
        with:
          path: outputs

  # 部署到 GitHub Pages（需先启用 Pages 并选择 GitHub Actions 作为来源）
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    continue-on-error: true     # Pages 未启用时不阻断主流程

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
