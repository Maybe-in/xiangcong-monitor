name: 香葱行情日报

on:
  schedule:
    # GitHub Actions 使用 UTC。北京时间 03:00 = 前一日 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xiangcong-daily-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成日报
        run: python run.py

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs data
          if git diff --staged --quiet; then
            echo "无内容变更，跳过提交"
          else
            git commit -m "chore: 香葱行情日报 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true      # Pages 未启用时不阻断报告生成
        with:
          path: outputs

  # 部署到 GitHub Pages（需先启用 Pages 并选择 GitHub Actions 作为来源）
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    continue-on-error: true     # Pages 未启用时不阻断主流程

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
